<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 令牌输入 · AI 模拟面试</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="seal">面</div>
    <h2>AI 模拟面试</h2>
    <div class="sub">MOCK INTERVIEW CONSOLE</div>

    <label for="tk">访问令牌</label>
    <input id="tk" class="input mono" type="password" placeholder="输入 APP_TOKEN" value="••••••••••••••••">

    <button class="btn btn-primary btn-lg">
      进入系统
      <svg class="ic" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
    </button>

    <div class="login-tip">
      令牌来自后端 <span class="mono">.env</span> 文件的 <span class="mono">APP_TOKEN</span><br>
      本地部署 · 单用户模式 · 数据不出本机
    </div>
  </div>
</div>

<div class="mockup-nav"><a href="index.html">
  <svg class="ic" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
  返回导航</a></div>
</body>
</html>
