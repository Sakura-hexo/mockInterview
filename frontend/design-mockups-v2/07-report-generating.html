<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>07 报告生成中 · AI 模拟面试</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="seal">面</div>
      <div>
        <div class="brand-name">AI 模拟面试</div>
        <div class="brand-sub mono">MOCK INTERVIEW</div>
      </div>
    </div>
    <button class="new-btn">
      <svg class="ic" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      新建面试
    </button>
    <div class="side-scroll">
      <div class="side-label mono">已归档 · Archive</div>
      <div class="hist-item active">
        <div class="hist-l1"><span>Java 后端 · 中等</span><span class="status st-wait"><i></i>生成中</span></div>
        <div class="hist-l2 mono"><span>10 题 · 刚结束</span><span>刚刚</span></div>
      </div>
    </div>
    <div class="side-foot"><span class="mono">LOCAL · v0.1</span><button class="link-btn">退出</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumbs">
        复盘报告
        <span class="sep">/</span>
        <span class="light">Java 后端 · 中等</span>
      </div>
      <span class="pill pill-wait"><i></i>报告生成中</span>
      <div class="spacer"></div>
    </header>

    <div class="main-body">
      <div class="gen-wrap">
        <div class="spinner"></div>
        <h1 style="font-size:19px; font-weight:700;">复盘点评智能体正在生成报告</h1>
        <p style="font-size:13px; color:var(--text-2); margin-top:8px;">
          正在分析 10 题回答、逐题评分并汇总改进建议，通常需要 15–30 秒
        </p>

        <div class="gen-steps">
          <div class="gs-row">
            <span class="gs-ic gs-ok">
              <svg class="ic" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>
            </span>
            <span>面试消息汇总</span>
          </div>
          <div class="gs-row">
            <span class="gs-ic gs-ok">
              <svg class="ic" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>
            </span>
            <span>逐题评分</span>
          </div>
          <div class="gs-row">
            <span class="gs-ic gs-run">
              <svg class="ic" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/></svg>
            </span>
            <span>生成改进建议中…</span>
          </div>
          <div class="gs-row wait">
            <span class="gs-ic gs-wait"></span>
            <span>汇总输出</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="mockup-nav"><a href="index.html">
  <svg class="ic" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
  返回导航</a></div>
</body>
</html>
