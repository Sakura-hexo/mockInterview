<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>07 报告生成中 - AI 模拟面试平台 V3</title>
<link rel="stylesheet" href="shared.css">
<style>
  .gen-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14vh 24px;
    text-align: center;
  }
  .gen-ring {
    width: 64px;
    height: 64px;
    border: 3px solid var(--paper-2);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 26px;
  }
  .gen-wrap h2 {
    font-family: var(--f-display);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .gen-wrap p { color: var(--ink-2); font-size: 13px; line-height: 1.9; }
  .gen-steps {
    margin-top: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 20px 30px;
    min-width: 340px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .gstep {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .gbox {
    width: 16px; height: 16px;
    border: 1.5px solid var(--line);
    border-radius: 2px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .gstep.done { color: var(--ink); }
  .gstep.done .gbox { background: var(--navy); border-color: var(--navy); color: #fff; }
  .gstep.running { color: var(--ink); }
  .gstep.running .gbox { border-color: var(--red); }
  .gstep.running .gbox i {
    width: 7px; height: 7px;
    background: var(--red);
    border-radius: 1px;
    animation: blink 1s infinite;
  }
  .gstep.pending { color: var(--ink-3); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="name">AI 模拟面试</div>
      <div class="sub">本地部署 · 单用户模式</div>
    </div>
    <button class="new-btn">＋ 新建面试</button>

    <div class="side-scroll">
      <div class="side-label">已结束</div>
      <div class="hist-item active">
        <div class="hist-l1">
          <span class="dir">Java 后端 · 中等</span>
          <span class="tag tag-wait">生成中</span>
        </div>
        <div class="hist-l2"><span>10题 · 刚刚结束</span><span>刚刚</span></div>
      </div>
    </div>

    <div class="side-foot">
      <span class="mono">LOCAL</span>
      <button class="link-btn">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title">复盘报告 · Java 后端 · 中等 <span class="tag tag-wait">报告生成中</span></div>
      <div class="spacer"></div>
    </header>

    <div class="main-body">
      <div class="gen-wrap">
        <div class="gen-ring"></div>
        <h2>正在批阅本场面试</h2>
        <p>复盘点评智能体正在分析你的 10 题回答、逐题评分、汇总改进建议<br>通常需要 15-30 秒，请稍候</p>

        <div class="gen-steps">
          <div class="gstep done"><span class="gbox">✓</span>面试消息汇总完成</div>
          <div class="gstep done"><span class="gbox">✓</span>逐题评分完成</div>
          <div class="gstep running"><span class="gbox"><i></i></span>生成改进建议中…</div>
          <div class="gstep pending"><span class="gbox"></span>汇总输出</div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="mockup-nav"><a href="index.html">← 返回设计稿导航</a></div>
</body>
</html>
