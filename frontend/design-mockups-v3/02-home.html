<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 历史会话首页 - AI 模拟面试平台 V3</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="name">AI 模拟面试</div>
      <div class="sub">本地部署 · 单用户模式</div>
    </div>

    <button class="new-btn">＋ 新建面试</button>

    <div class="side-scroll">
      <div class="side-label">进行中</div>
      <div class="hist-item">
        <div class="hist-l1">
          <span class="dir">Java 后端 · 中等</span>
          <span class="tag tag-live">进行中</span>
        </div>
        <div class="hist-l2"><span>第 4/10 题</span><span>10分钟前</span></div>
      </div>

      <div class="side-label">已结束</div>
      <div class="hist-item">
        <div class="hist-l1">
          <span class="dir">Java 后端 · 困难</span>
          <span class="tag tag-done">已出报告</span>
        </div>
        <div class="hist-l2"><span>10题 · 综合 7.8</span><span>昨天</span></div>
      </div>
      <div class="hist-item">
        <div class="hist-l1">
          <span class="dir">Java 后端 · 简单</span>
          <span class="tag tag-done">已出报告</span>
        </div>
        <div class="hist-l2"><span>5题 · 综合 8.4</span><span>3天前</span></div>
      </div>
      <div class="hist-item">
        <div class="hist-l1">
          <span class="dir">Java 后端 · 中等</span>
          <span class="tag tag-wait">待生成</span>
        </div>
        <div class="hist-l2"><span>10题</span><span>5天前</span></div>
      </div>
      <div class="hist-item">
        <div class="hist-l1">
          <span class="dir">Java 后端 · 中等</span>
          <span class="tag tag-done">已出报告</span>
        </div>
        <div class="hist-l2"><span>10题 · 综合 6.5</span><span>1周前</span></div>
      </div>
    </div>

    <div class="side-foot">
      <span class="mono">LOCAL</span>
      <button class="link-btn">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title">历史会话</div>
      <div class="spacer"></div>
      <span class="tag tag-plain">共 5 场</span>
    </header>

    <div class="main-body">
      <div class="empty">
        <h2>开始你的第一场模拟面试</h2>
        <p>
          上传简历 + 粘贴目标岗位 JD<br>
          AI 面试官将基于你的简历进行多轮提问与追问<br>
          结束后输出结构化评分与改进建议
        </p>
        <button class="btn btn-primary">＋ 新建面试</button>
      </div>
    </div>
  </main>
</div>

<div class="mockup-nav"><a href="index.html">← 返回设计稿导航</a></div>
</body>
</html>
