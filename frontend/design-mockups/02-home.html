<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 历史会话首页 - AI 模拟面试平台</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">AI 模拟面试</div>

    <button class="new-chat-btn">＋ 新建面试</button>

    <div class="sidebar-section">进行中</div>
    <div class="conversation-list">
      <div class="conversation-item">
        <div class="conversation-title">
          <span>Java 后端 · 中等</span>
          <span class="badge badge-blue">进行中</span>
        </div>
        <div class="conversation-meta">
          <span>第 4/10 题</span>
          <span>10分钟前</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section">已结束</div>
    <div class="conversation-list">
      <div class="conversation-item">
        <div class="conversation-title">
          <span>Java 后端 · 困难</span>
          <span class="badge badge-green">已出报告</span>
        </div>
        <div class="conversation-meta">
          <span>10题 · 综合 7.8</span>
          <span>昨天</span>
        </div>
      </div>
      <div class="conversation-item">
        <div class="conversation-title">
          <span>Java 后端 · 简单</span>
          <span class="badge badge-green">已出报告</span>
        </div>
        <div class="conversation-meta">
          <span>5题 · 综合 8.4</span>
          <span>3天前</span>
        </div>
      </div>
      <div class="conversation-item">
        <div class="conversation-title">
          <span>Java 后端 · 中等</span>
          <span class="badge badge-yellow">待生成</span>
        </div>
        <div class="conversation-meta">
          <span>10题</span>
          <span>5天前</span>
        </div>
      </div>
      <div class="conversation-item">
        <div class="conversation-title">
          <span>Java 后端 · 中等</span>
          <span class="badge badge-green">已出报告</span>
        </div>
        <div class="conversation-meta">
          <span>10题 · 综合 6.5</span>
          <span>1周前</span>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <span>本机模式</span>
      <button>退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <div class="title">历史会话</div>
      <div class="actions">
        <span class="badge badge-gray">共 5 场</span>
      </div>
    </header>

    <div class="main-body">
      <div class="empty-hint">
        <h2>开始你的第一场模拟面试</h2>
        <p>
          上传简历 + 粘贴目标岗位 JD<br>
          AI 面试官将基于你的简历进行多轮提问与追问<br>
          结束后输出结构化评分与改进建议
        </p>
        <button class="btn btn-primary">＋ 新建面试</button>
      </div>
    </div>
  </main>
</div>

<div class="mockup-nav"><a href="index.html">← 返回设计稿导航</a></div>
</body>
</html>
