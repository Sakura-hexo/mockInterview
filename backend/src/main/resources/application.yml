spring:
  application:
    name: ai-mock-interview
  # 数据源不在本文件配置：后端一律经 EnvKeys 读 .env 或环境变量（单一事实源）
  # actuator 的 db 健康检查复用 AppConfig 装配的连接池
  data:
    redis:
      # 与 EnvKeys.redisUri 同源：容器内 REDIS_URI 指向服务名，健康检查随之生效
      url: ${REDIS_URI:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      # Milvus SDK 传递依赖引入 ES 客户端，本项目无 Elasticsearch，关闭该健康检查
      enabled: false
