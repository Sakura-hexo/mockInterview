# CI：后端单测 + 前端单测与构建 + 镜像构建验证（main 推送时）
# 后端 189 例单测无外部依赖（Fake 桩 + 内存实现），无需密钥即可在 Actions 上复现。
name: CI

on:
  push:
    branches: [main, frontend]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端单测（189 例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 跑单测
        working-directory: backend
        run: mvn -B test

  frontend-test:
    name: 前端单测与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: vitest + vite build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  docker-build:
    name: 后端镜像构建验证（不推送）
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 打包 jar（测试已在上游跑过）
        working-directory: backend
        run: mvn -B package -DskipTests
      - name: docker build 验证 Dockerfile
        working-directory: backend
        run: docker build -t interview-backend:ci .
